# Прод: образы из GHCR, на сервере ничего не собирается. Запуск описан в README.md.
services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app, nlq-db]

  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BIND_ADDR: "8080"
      RECEIPTS_DIR: /data/receipts
    volumes:
      - receipts-data:/data/receipts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/ping | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app]

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

  # Mini App: статика, главный nginx проксирует на неё /tg/.
  miniapp:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-miniapp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [app]

  nginx:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # fullchain.pem и key.pem: scripts/cert.sh issue
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - miniapp
    networks: [app]

  # NL-ассистент: один образ, три команды. Backend от него не зависит, без ключей ассистент отвечает 503.

  nlq-db-init:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-nlq:${IMAGE_TAG:-latest}
    command: ["nlq.dbinit"]
    restart: "no"
    environment:
      ADMIN_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NLQ_DB_PASSWORD: ${NLQ_DB_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [nlq-db]

  nlq-mcp:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-nlq:${IMAGE_TAG:-latest}
    command: ["nlq.mcp_server"]
    restart: unless-stopped
    # Без env_file: ключа OpenRouter здесь быть не должно.
    environment:
      APP_ENV: production
      NLQ_DB_DSN: postgres://nlq_reader:${NLQ_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NLQ_ACTOR_PUBLIC_KEY: ${NLQ_ACTOR_PUBLIC_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      NLQ_USER_SCOPE: ${NLQ_USER_SCOPE:-team}
      NLQ_MAX_ROWS: "20"
    depends_on:
      nlq-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "nlq.health", "mcp"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Без сети app: интернета нет.
    networks: [nlq, nlq-db]

  nlq-agent:
    image: ${IMAGE_PREFIX:-ghcr.io/avgsync/invoice-keeper}-nlq:${IMAGE_TAG:-latest}
    command: ["nlq.agent"]
    restart: unless-stopped
    # Ключ LLM можно держать в .env.nlq (LLM_API_KEY); без ключа агент работает в режиме rules.
    env_file:
      - path: .env.nlq
        required: false
    environment:
      APP_ENV: production
      NLQ_MODELS: ${NLQ_MODELS:-anthropic/claude-sonnet-4.5,google/gemini-2.5-flash}
      NLQ_LLM: ${NLQ_LLM:-llm}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MAX_TOKENS_FIELD: ${LLM_MAX_TOKENS_FIELD:-max_tokens}
      NLQ_RULES_FALLBACK: ${NLQ_RULES_FALLBACK:-true}
      NLQ_ACTOR_PUBLIC_KEY: ${NLQ_ACTOR_PUBLIC_KEY:-}
      NLQ_MCP_URL: http://nlq-mcp:8900/mcp
      NLQ_PUBLIC_URL: https://${DOMAIN}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    depends_on:
      nlq-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nlq.health", "agent"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # app: вход от backend и выход к LLM API; nlq: связь с MCP.
    networks: [app, nlq]

volumes:
  postgres-data:
  receipts-data:

networks:
  app:
    driver: bridge
  # Внутренние сети без доступа в интернет.
  nlq:
    internal: true
  nlq-db:
    internal: true
