# Локальная точка входа (docker-compose.local.yaml): то же, что в проде, но без TLS. http://localhost:8000
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 12m;

  # Имена контейнеров резолвятся динамически: после пересоздания контейнеров IP меняются.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream  http://backend:8080;
  set $miniapp_upstream  http://miniapp:8080;
  set $frontend_upstream http://frontend:3000;

  # SSE-стрим ассистента: без буферизации.
  location /api/v1/assistant/ask/stream {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    chunked_transfer_encoding on;
  }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /tg { return 301 /tg/; }

  location /tg/ {
    proxy_pass $miniapp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
