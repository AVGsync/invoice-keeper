# Статика Mini App; главный nginx проксирует сюда /tg/ без переписывания пути.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # index.html не кэшируем, иначе после деплоя останется старый бандл.
  location = /tg/index.html { add_header Cache-Control "no-cache" always; }

  # Ассеты с хэшем кэшируем навсегда.
  location /tg/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA-fallback.
  location /tg/ {
    try_files $uri $uri/ /tg/index.html;
    add_header Cache-Control "no-cache" always;
  }
}
