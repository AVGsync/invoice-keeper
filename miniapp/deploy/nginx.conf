# Раздача статики Mini App внутри образа miniapp. Главный nginx проксирует сюда
# /tg/ на порт 8080 без переписывания URI, поэтому пути здесь начинаются с /tg/.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;        # иначе try_files-редиректы указывали бы на http://miniapp:8080
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Проба живости для HEALTHCHECK в Dockerfile.
  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # index.html всегда свежий: иначе после деплоя клиент тянул бы старый бандл.
  location = /tg/index.html { add_header Cache-Control "no-cache" always; }

  # Ассеты с хэшем в имени — неизменяемы, кэшируем навсегда.
  location /tg/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA-fallback: любой /tg/* путь отдаёт index.html (его перехватит
  # location = /tg/index.html с no-cache).
  location /tg/ {
    try_files $uri $uri/ /tg/index.html;
    add_header Cache-Control "no-cache" always;
  }
}
