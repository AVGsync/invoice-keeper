services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice_keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_keeper}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice_keeper} -d ${POSTGRES_DB:-invoice_keeper}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [app-local]

  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    volumes:
      - ./backend/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-invoice_keeper}:${POSTGRES_PASSWORD:-invoice_local_password}@postgres:5432/${POSTGRES_DB:-invoice_keeper}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app-local]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      DEBUG: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BIND_ADDR: "8080"
      RECEIPTS_DIR: /data/receipts
    volumes:
      - receipts-local-data:/data/receipts
    ports:
      - "${LOCAL_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/ping | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app-local]

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-ad@ad.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LOCAL_PGADMIN_PORT:-5050}:80"
    networks: [app-local]

  # NL-ассистент: образ собирается из ./nlq. Ключи actor-JWT генерирует
  # `docker compose -f docker-compose.local.yaml run --rm --no-deps nlq-agent nlq.keygen`.
  nlq-db-init:
    build: ./nlq
    image: invoice-keeper-nlq:local
    command: ["nlq.dbinit"]
    restart: "no"
    environment:
      ADMIN_DSN: postgres://${POSTGRES_USER:-invoice_keeper}:${POSTGRES_PASSWORD:-invoice_local_password}@postgres:5432/${POSTGRES_DB:-invoice_keeper}?sslmode=disable
      NLQ_DB_PASSWORD: ${NLQ_DB_PASSWORD:-nlq_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_keeper}
      APP_ENV: local
      NLQ_DEV_SCHEMA: ${NLQ_DEV_SCHEMA:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app-local]

  nlq-mcp:
    build: ./nlq
    image: invoice-keeper-nlq:local
    command: ["nlq.mcp_server"]
    restart: unless-stopped
    environment:
      APP_ENV: local
      NLQ_DB_DSN: postgres://nlq_reader:${NLQ_DB_PASSWORD:-nlq_local_password}@postgres:5432/${POSTGRES_DB:-invoice_keeper}?sslmode=disable
      NLQ_ACTOR_PUBLIC_KEY: ${NLQ_ACTOR_PUBLIC_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      NLQ_USER_SCOPE: ${NLQ_USER_SCOPE:-team}
      NLQ_MAX_ROWS: "20"
      NLQ_DEV_SCHEMA: ${NLQ_DEV_SCHEMA:-}
      NLQ_TODAY: ${NLQ_TODAY:-}
    ports:
      - "127.0.0.1:8900:8900" # MCP Inspector с токеном из `python -m nlq.devtoken`
    depends_on:
      nlq-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "nlq.health", "mcp"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app-local]

  nlq-agent:
    build: ./nlq
    image: invoice-keeper-nlq:local
    command: ["nlq.agent"]
    restart: unless-stopped
    env_file:
      - path: .env.nlq
        required: false
    environment:
      APP_ENV: local
      NLQ_MODELS: ${NLQ_MODELS:-anthropic/claude-sonnet-4.5,google/gemini-2.5-flash}
      NLQ_LLM: ${NLQ_LLM:-openrouter}
      NLQ_RULES_FALLBACK: ${NLQ_RULES_FALLBACK:-true}
      NLQ_ACTOR_PUBLIC_KEY: ${NLQ_ACTOR_PUBLIC_KEY:-}
      NLQ_MCP_URL: http://nlq-mcp:8900/mcp
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      NLQ_TODAY: ${NLQ_TODAY:-}
    ports:
      - "127.0.0.1:8090:8090" # отладка; Go на хосте: NLQ_AGENT_URL=http://localhost:8090
    depends_on:
      nlq-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nlq.health", "agent"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [app-local]

volumes:
  postgres-local-data:
  receipts-local-data:

networks:
  app-local:
    driver: bridge
