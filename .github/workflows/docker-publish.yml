name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Падение одного образа не должно отменять сборку остальных.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: migrations
            context: ./backend
            dockerfile: ./backend/Dockerfile.migrate
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          # Telegram Mini App (miniapp/): отдельный статичный образ, раздаётся
          # главным nginx по /tg/.
          - name: miniapp
            context: ./miniapp
            dockerfile: ./miniapp/Dockerfile
          - name: nginx
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
          # Один образ -nlq на три команды NL-ассистента (nlq.agent / nlq.mcp_server /
          # nlq.dbinit); команда выбирается в compose (docs/NL_QUERIES.md §10.2).
          - name: nlq
            context: ./nlq
            dockerfile: ./nlq/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase image name
        id: prep
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/invoice-keeper-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ github.sha }}
          # Отдельный scope на каждый образ, иначе кэши затирают друг друга.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
