name: Mini App tests

on:
  push:
    branches: [main]
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-tests.yml'
  pull_request:
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      # npm 12.2.0 — тот же, что сгенерировал package-lock.json и собирает образ.
      - name: Install npm 12.2.0
        run: npm install -g npm@12.2.0

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm test

      - name: build
        run: npm run build

      # Playwright (e2e) в CI не гоняем: требует браузер и прод-preview, прогон
      # локально (docs: npm run e2e).
