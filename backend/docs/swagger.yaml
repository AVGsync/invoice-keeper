      responses:
        "204":
          description: Настройки обновлены
        "400":
          description: Невалидное тело запроса или значения полей
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "404":
          description: Настройки не найдены
          schema:
            type: string
        "500":
          description: Не удалось обновить настройки
          schema:
