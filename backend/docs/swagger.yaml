basePath: /api/v1
definitions:
  handler.PatchPaymentOccurrenceRequest:
    properties:
      action:
        type: string
      amount:
        type: integer
      currency:
        type: string
      description:
        type: string
      due_date:
        type: string
      paid_date:
        type: string
    type: object
  handler.PaymentCurrencySummary:
    properties:
      currency:
        type: string
      outstanding_total:
        type: integer
      overdue_total:
        type: integer
      paid_total:
        type: integer
    type: object
  handler.PaymentSummaryResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.PaymentCurrencySummary'
        type: array
    type: object
  model.Persona:
    properties:
      created_at:
        description: Когда создана.
        example: "2026-10-23T20:05:31Z"
        type: string
      description:
        description: Описание, до 255 символов; `null`, если не задано.
        example: Оплачивает аренду и подписки
        type: string
        x-nullable: true
      id:
        description: Идентификатор персоны.
        example: 223f4e8e-98ea-4e50-9fb7-a9ea8984b2f1
        format: uuid
        type: string
      name:
        description: Название, 1–64 символа, уникально без учёта регистра.
        example: Бухгалтер
        type: string
      users_count:
        description: Сколько пользователей с этой персоной.
        example: 1
        type: integer
    type: object
  model.PersonaRef:
    properties:
      id:
        description: Идентификатор персоны.
        example: 223f4e8e-98ea-4e50-9fb7-a9ea8984b2f1
        format: uuid
        type: string
      name:
        description: Название персоны.
        example: Бухгалтер
        type: string
    type: object
  model.RecurrentPayment:
    properties:
      amount:
        description: Сумма в минимальных денежных единицах
        type: integer
      assignee_id:
        description: AssigneeID — ответственный (user_recurrent_payments, ровно один);
          nil, если не назначен.
        type: string
      assignee_name:
        description: AssigneeName — полное имя ответственного (для списков и бота).
        type: string
      created_at:
        type: string
      currency:
        type: string
      day_offset:
        description: |-
          Для monthly: день месяца (1–31)
          Для weekly: день недели (0–6)
        type: integer
      description:
        type: string
      frequency:
        description: weekly, monthly
        type: string
      id:
        format: uuid
        type: string
      interval:
        description: Каждые N недель или месяцев
        type: integer
      start_date:
        description: StartDate — ближайшая дата оплаты (якорь графика), "YYYY-MM-DD".
        type: string
      stopped_at:
        description: StoppedAt — момент мягкой остановки; nil у активного шаблона.
        type: string
      updated_at:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        description: Когда создан.
        example: "2026-10-23T20:05:31Z"
        type: string
      full_name:
        description: Полное имя.
        example: Ольга Иванова
        type: string
      id:
        description: Идентификатор пользователя.
        example: 9a191dfa-5e71-47aa-bcb2-ed5e9c071830
        format: uuid
        type: string
      login:
        description: Логин для входа.
        example: olga
        type: string
      persona:
        allOf:
        - $ref: '#/definitions/model.PersonaRef'
        description: Персона (должность) пользователя; `null`, если не назначена или
          была удалена.
        x-nullable: true
      role:
        description: 'Роль: `admin` — администратор из .env, `user` — обычный пользователь.'
        enum:
        - admin
        - user
        example: user
        type: string
    type: object
  model.UserNotificationSettings:
    properties:
      created_at:
        type: string
      days_before_due:
        type: integer
      email:
        type: string
      email_enabled:
        type: boolean
      email_verified:
        type: boolean
      send_time:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  request.AssistantAskRequest:
    properties:
      channel:
        description: 'Канал обращения: web (по умолчанию) или miniapp.'
        enum:
        - web
        - miniapp
        example: web
        type: string
      question:
        description: Вопрос на естественном языке, 1–500 символов.
        example: что просрочено?
        type: string
    type: object
  request.CreatePersonaRequest:
    properties:
      description:
        description: Описание, до 255 символов. Необязательно; пустая строка сохраняется
          как `null`.
        example: Оплачивает аренду и подписки
        maxLength: 255
        type: string
      name:
        description: Название, 1–64 символа (пробелы по краям обрезаются), уникально
          без учёта регистра.
        example: Бухгалтер
        maxLength: 64
        minLength: 1
        type: string
    required:
    - name
    type: object
  request.CreateRecurrentPaymentRequest:
    properties:
      amount:
        type: integer
      assignee_id:
        type: string
      currency:
        type: string
      day_offset:
        type: integer
      description:
        type: string
      frequency:
        type: string
      interval:
        type: integer
      start_date:
        type: string
    type: object
  request.CreateUserRequest:
    properties:
      full_name:
        description: Полное имя пользователя, отображается в профиле.
        example: Иван Петров
        maxLength: 64
        minLength: 3
        type: string
      login:
        description: Уникальный логин, используется для входа.
        example: ivan.petrov
        maxLength: 64
        minLength: 3
        type: string
      password:
        description: 'Пароль, минимум 8 символов. Роль не передаётся: создаётся всегда
          обычный пользователь.'
        example: Str0ngPass!2026
        minLength: 8
        type: string
      persona_id:
        description: |-
          Персона (должность) из `GET /personas`. Необязательно: без поля пользователь
          создаётся без персоны. Несуществующий id → `400 persona not found`.
        example: 223f4e8e-98ea-4e50-9fb7-a9ea8984b2f1
        format: uuid
        type: string
    required:
    - full_name
    - login
    - password
    type: object
  request.LoginRequest:
    properties:
      login:
        description: Логин зарегистрированного пользователя.
        example: ivan.petrov
        maxLength: 64
        minLength: 3
        type: string
      password:
        description: Пароль пользователя.
        example: Str0ngPass!2026
        type: string
    required:
    - login
    - password
    type: object
  request.MiniAppAuthRequest:
    properties:
      init_data:
        description: Сырая строка initData из Telegram.WebApp (query-формат). Не логируется.
        example: query_id=...&user=%7B...%7D&auth_date=...&hash=...
        type: string
    type: object
  request.MiniAppLinkRequest:
    properties:
      init_data:
        description: Сырая строка initData из Telegram.WebApp. Не логируется.
        example: query_id=...&user=%7B...%7D&auth_date=...&hash=...
        type: string
      login:
        description: Логин аккаунта в Invoice Keeper.
        example: ivan.petrov
        type: string
      password:
        description: Пароль аккаунта. В логи не попадает.
        example: Str0ngPass!2026
        type: string
    type: object
  request.PatchUserNotificationSettingsRequest:
    properties:
      days_before_due:
        type: integer
      email:
        type: string
      email_enabled:
        type: boolean
      send_time:
        type: string
      timezone:
        type: string
    type: object
  request.UpdatePersonaRequest:
    properties:
      description:
        description: |-
          Новое описание, до 255 символов. Если поле не передано, не меняется;
          пустая строка `""` удаляет описание.
        example: Оплачивает аренду, подписки и налоги
        maxLength: 255
        type: string
      name:
        description: Новое название, 1–64 символа. Если поле не передано, текущее
          значение не меняется.
        example: Главный бухгалтер
        maxLength: 64
        minLength: 1
        type: string
    type: object
  request.UpdateRecurrentPaymentRequest:
    properties:
      amount:
        type: integer
      assignee_id:
        type: string
      currency:
        type: string
      day_offset:
        type: integer
      description:
        type: string
      frequency:
        type: string
      interval:
        type: integer
      start_date:
        type: string
    type: object
  request.UpdateUserNotificationSettingsRequest:
    properties:
      days_before_due:
        type: integer
      email:
        type: string
      email_enabled:
        type: boolean
      send_time:
        type: string
      timezone:
        type: string
    type: object
  request.UserUpdateRequest:
    properties:
      full_name:
        description: Новое полное имя. Если поле не передано, текущее значение не
          меняется.
        example: Иван Сергеевич Петров
        maxLength: 64
        minLength: 3
        type: string
      login:
        description: Новый логин. Если поле не передано, текущее значение не меняется.
        example: ivan.new
        maxLength: 64
        minLength: 3
        type: string
    type: object
  response.APIError:
    properties:
      code:
        description: Code — стабильный машинный код; клиентская логика ветвится по
          нему.
        example: payment_not_found
        type: string
      details:
        description: Details содержит предметные данные, например currency или period
          при ошибке валидации платежа.
        type: object
      message:
        description: Message предназначен для диагностики; UI может локализовать сообщение
          по Code.
        example: payment not found
        type: string
      request_id:
        description: RequestID совпадает с response header X-Request-ID и нужен для
          диагностики.
        example: f16cc96e-aaf4-44fb-a462-836ed4d0b135
        type: string
    type: object
  response.AssistantAnswerResponse:
    properties:
      answer_id:
        description: AnswerID совпадает с X-Request-ID.
        example: f16cc96e-aaf4-44fb-a462-836ed4d0b135
        type: string
      blocks:
        description: 'Блоки данных (до 3): occurrence_list, currency_totals, payment_list,
          people_list.'
        items:
          type: object
        type: array
      error_code:
        description: 'ErrorCode при status=error: llm_unavailable | data_unavailable
          | timeout | bad_question.'
        example: llm_unavailable
        type: string
      followups:
        description: Подсказки «можно спросить…».
        example:
        - Кто отвечает за просроченные?
        items:
          type: string
        type: array
      meta:
        description: Метаданные ответа (модель, токены, стоимость, латентность); показываются
          только админу.
        type: object
      mode:
        description: 'Режим: llm | rules | fake.'
        enum:
        - llm
        - rules
        - fake
        example: llm
        type: string
      notes:
        description: Оговорки, добавленные агентом.
        example:
        - другие валюты не учитывались и не пересчитывались
        items:
          type: string
        type: array
      status:
        description: 'Статус: ok | partial | error.'
        enum:
        - ok
        - partial
        - error
        example: ok
        type: string
      text:
        description: Короткий текст ответа, plain text.
        example: Просрочено 4 платежа.
        type: string
    type: object
  response.AssistantStatusResponse:
    properties:
      enabled:
        description: Включена ли фича (NLQ_ENABLED).
        example: true
        type: boolean
      examples:
        description: Примеры вопросов для подсказки в UI.
        example:
        - Что просрочено?
        - Сколько платим в долларах в этом месяце?
        - Кто отвечает за аренду?
        items:
          type: string
        type: array
      healthy:
        description: Отвечает ли агент на /healthz (кэш 10 с). При выключенной фиче
          всегда false.
        example: true
        type: boolean
      mode:
        description: 'Режим «мозга» агента: openrouter | rules | fake. Пусто, если
          агент недоступен.'
        example: openrouter
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        allOf:
        - $ref: '#/definitions/response.APIError'
        description: Error — единый envelope JSON-ошибок.
    type: object
  response.MiniAppAuthResponse:
    properties:
      access_token:
        description: Access-токен (Bearer). Хранится в памяти JS, cookie не выставляются.
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      dm_available:
        description: Может ли бот писать пользователю в личку (allows_write_to_pm
          из initData).
        example: true
        type: boolean
      expires_in:
        description: Сколько секунд живёт access-токен.
        example: 3600
        type: integer
      token_type:
        description: Тип токена, всегда Bearer.
        example: Bearer
        type: string
      user:
        allOf:
        - $ref: '#/definitions/response.MiniAppUser'
        description: Профиль вошедшего пользователя.
    type: object
  response.MiniAppUser:
    properties:
      full_name:
        description: Полное имя.
        example: Иван Петров
        type: string
      id:
        description: Идентификатор пользователя.
        example: 9a191dfa-5e71-47aa-bcb2-ed5e9c071830
        format: uuid
        type: string
      role:
        description: 'Роль: admin | user. Админ получает полные права и в Mini App.'
        enum:
        - admin
        - user
        example: user
        type: string
    type: object
  response.PaymentListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.PaymentResponse'
        type: array
      total:
        type: integer
    type: object
  response.PaymentResponse:
    properties:
      amount:
        type: integer
      assignee_name:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      due_date:
        type: string
      ended:
        type: boolean
      id:
        type: string
      paid_at:
        type: string
      paid_date:
        type: string
      paid_late:
        type: boolean
      recurrent_payment_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  response.PersonaListResponse:
    properties:
      items:
        description: Персоны, отсортированные по названию (без учёта регистра).
        items:
          $ref: '#/definitions/model.Persona'
        type: array
      total:
        description: Сколько всего персон.
        example: 1
        type: integer
    type: object
  response.TelegramLinkCodeResponse:
    properties:
      deep_link:
        description: Ссылка t.me для привязки, открывается в Telegram.
        example: https://t.me/ik_dev_bot?start=link_AbC...
        type: string
      expires_in:
        description: Сколько секунд живёт код.
        example: 600
        type: integer
    type: object
  response.TelegramLinkResponse:
    properties:
      bot_blocked:
        description: Заблокировал ли пользователь бота.
        type: boolean
      dm_enabled:
        description: Включена ли доставка в личку.
        type: boolean
      linked:
        description: Привязан ли Telegram.
        example: true
        type: boolean
      linked_at:
        description: Когда привязан.
        type: string
      tg_username:
        description: Username в Telegram (может быть пустым).
        example: ivan
        type: string
    type: object
  response.TelegramTeamChatResponse:
    properties:
      bound:
        description: Привязан ли активный командный чат.
        example: true
        type: boolean
      bound_at:
        description: Когда привязан.
        type: string
      is_active:
        description: Активен ли чат.
        type: boolean
      last_error:
        description: Последняя ошибка доставки (например, «бот удалён из чата») или
          null.
        type: string
      tg_chat_id:
        description: ID чата в Telegram.
        example: -1001234567890
        type: integer
      title:
        description: Название чата или null.
        example: Финансы
        type: string
    type: object
  response.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/model.User'
        type: array
      total:
        type: integer
    type: object
info:
  contact: {}
  description: Напоминания о регулярных платежах.
  title: Invoice Keeper API
  version: "1.0"
paths:
  /assistant/ask:
    post:
      consumes:
      - application/json
      description: |-
        Задаёт ассистенту вопрос на естественном языке о платежах команды
        («что просрочено?», «сколько платим в долларах в этом месяце?»). Go
        аутентифицирует пользователя, применяет лимиты, перечитывает роль из БД,
        подписывает короткоживущий actor-JWT и проксирует вопрос в nlq-agent.
        Ответ — конверт §7.9: короткий текст плюс блоки с данными. Числа и даты
        считает БД, текст проходит grounding-check.
      parameters:
      - description: Вопрос и канал (web|miniapp)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AssistantAskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Конверт ответа агента
          schema:
            $ref: '#/definitions/response.AssistantAnswerResponse'
        "400":
          description: Пустой/длинный вопрос или неверный channel (bad_request)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Нет или просрочен токен
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Превышен лимит (assistant_rate_limited), заголовок Retry-After
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Фича выключена/занята/агент недоступен (assistant_disabled|assistant_busy|assistant_unavailable)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
          description: Агент не уложился в таймаут (assistant_timeout)
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Вопрос ассистенту (NL-запрос о платежах)
      tags:
      - Ассистент
  /assistant/ask/stream:
    post:
      consumes:
      - application/json
      description: |-
        То же, что POST /assistant/ask, но ответ приходит потоком Server-Sent
        Events: кадры step (идёт инструмент), block (блок данных), text (текст
        после grounding) и done (полный конверт). Go проксирует поток от агента с
        немедленным flush и отключённой буферизацией (X-Accel-Buffering: no); при
        разрыве соединения с клиентом фоновая работа агента отменяется.
      parameters:
      - description: Вопрос и канал (web|miniapp)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AssistantAskRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'Поток SSE (event: step|block|text|done|error)'
          schema:
            type: string
        "400":
          description: bad_request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Нет или просрочен токен
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: assistant_rate_limited
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: assistant_disabled|assistant_busy|assistant_unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
          description: assistant_timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Вопрос ассистенту со стримингом (SSE)
      tags:
      - Ассистент
  /assistant/status:
    get:
      description: |-
        Включена ли фича и отвечает ли агент (кэш 10 с). UI прячет ассистента при
        enabled=false. При выключенной фиче healthy=false и mode пустой.
      produces:
      - application/json
      responses:
        "200":
          description: Статус ассистента
          schema:
            $ref: '#/definitions/response.AssistantStatusResponse'
        "401":
          description: Нет или просрочен токен
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Состояние ассистента
      tags:
      - Ассистент
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Проверяет логин и пароль пользователя. При успехе выставляет две
        HttpOnly-куки: `AccessToken` (TTL 1 час) и `RefreshToken` (TTL 7 дней),
        обе с флагами `Secure` и `SameSite=Strict`. Тело успешного ответа пустое —
        токены передаются только через Set-Cookie.

        Порядок проверок и коды ответов:
        1. тело не парсится как JSON → `400 invalid request body`;
        2. не прошла валидация (пустой login или password) → `400` с текстом ошибки;
        3. пользователь не найден ИЛИ неверный пароль → `401 invalid credentials`.
        В целях защиты от перебора все ошибки аутентификации отдаются одинаково (401),
        без различия «нет такого логина» / «неверный пароль».
      parameters:
      - description: Логин и пароль
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - text/plain
      responses:
        "200":
          description: Вход выполнен, куки AccessToken и RefreshToken установлены
        "400":
          description: Невалидное тело запроса или значения полей
          schema:
            type: string
        "401":
          description: Неверные учётные данные
          schema:
            type: string
      summary: Авторизация пользователя
      tags:
      - Auth
  /auth/logout:
    post:
      description: |-
        Отзывает refresh-токен, взятый из HttpOnly-куки `RefreshToken`, и удаляет
        обе куки `AccessToken` и `RefreshToken` (Set-Cookie с MaxAge=-1).

        Операция идемпотентна и всегда возвращает `204`:
        - куки нет или она пустая → просто чистим куки, БД не трогаем;
        - токен уже отозван / не найден в БД → ошибка отзыва логируется,
        но наружу не отдаётся (клиент всё равно считается вышедшим).
        Действующий access-токен для вызова не требуется. Access-токен stateless —
        сервер его не хранит, поэтому до истечения TTL он технически валиден;
        клиент обязан удалить его сам (здесь мы лишь стираем куку).
      produces:
      - text/plain
      responses:
        "204":
          description: Выход выполнен, куки очищены (или выходить уже нечем)
      summary: Выход пользователя из системы
      tags:
      - Auth
  /auth/me:
    get:
      description: |-
        Возвращает пользователя, которому принадлежит текущий access-токен. Frontend использует `id` как идентификатор текущего пользователя, `role` — для показа admin-only действий, `full_name` — для подписи интерфейса. Идентификатор пользователя из query/body не принимается и не может подменить пользователя из JWT.
        Веб-панель обычно аутентифицируется HttpOnly cookie `AccessToken`; Bearer также поддерживается. Пароль и refresh token в ответ не входят. Если access token отсутствует/просрочен, middleware завершает запрос до handler. После изменения роли или удаления пользователя клиенту следует перечитать профиль либо выполнить повторный login.
        Поле `persona` — персона (должность) пользователя `{id, name}` или `null`; на права не влияет.
      operationId: authMe
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: Не авторизован
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Профиль текущего пользователя
      tags:
      - Auth
  /auth/refresh:
    post:
      description: |-
        Обновляет пару токенов по refresh-токену из HttpOnly-куки `RefreshToken`.
        Действующий access-токен НЕ требуется (он как раз истёк) — личность
        подтверждается самим refresh-токеном.

        Порядок проверок и коды ответов:
        1. куки `RefreshToken` нет → `401 no refresh token`;
        2. токен невалиден: не найден в БД, отозван (`revoked_at`), истёк
        (`expires_at`) или не проходит проверку подписи → `401 invalid refresh token`;
        3. пользователь из токена не найден в БД → `401 user not found`;
        4. не удалось выпустить новую пару токенов → `500 failed to generate new tokens`.

        При успехе выполняется ротация: выпускается новая пара, СНАЧАЛА сохраняется
        новый refresh-токен, затем отзывается старый (одноразовость refresh-токена).
        Обновлённые `AccessToken` и `RefreshToken` возвращаются через Set-Cookie,
        тело ответа пустое.
      produces:
      - text/plain
      responses:
        "200":
          description: Токены обновлены, новые куки установлены
        "401":
          description: Refresh-токен отсутствует, невалиден, истёк или отозван
          schema:
            type: string
        "500":
          description: Не удалось выпустить новые токены
          schema:
            type: string
      summary: Обновление токенов (ротация)
      tags:
      - Auth
  /me/telegram:
    delete:
      description: Удаляет привязку Telegram текущего пользователя.
      produces:
      - application/json
      responses:
        "204":
          description: Отвязано
        "401":
