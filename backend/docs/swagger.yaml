  /personas:
    get:
      description: |-
        Возвращает весь справочник персон без пагинации, отсортированный по названию
        (без учёта регистра). Используется в форме создания пользователя: администратор
        выбирает персону из этого списка и передаёт её `id` в `persona_id`
        (`POST /users`).

        Персона — это должность или зона ответственности (Бухгалтер, Руководитель, DevOps).
        На права доступа она **не влияет**: права задаёт только роль (`admin` / `user`).

        Поля элемента:
        - `id` — UUID персоны;
        - `name` — название;
        - `description` — описание или `null`;
        - `users_count` — сколько пользователей с этой персоной (удобно показать
        перед удалением);
        - `created_at` — когда создана.

        Доступно только роли `admin`.

        Коды ответов:
        - `200` — объект со списком в `items` и количеством в `total` (пустой справочник —
        `items: []`, `total: 0`);
        - `401 unauthorized` — нет или просрочен access-токен (middleware Auth);
        - `403 forbidden` — роль не `admin` (middleware IsAdmin);
        - `500 failed to get personas` — ошибка БД.
      produces:
      - application/json
      responses:
        "200":
          description: Список персон с total
          schema:
            $ref: '#/definitions/response.PersonaListResponse'
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав (требуется роль admin)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Список персон
      tags:
      - Personas
    post:
      consumes:
      - application/json
      description: |-
        Добавляет персону в справочник. После этого её можно назначать новым
        пользователям через `persona_id` в `POST /users`. Доступно только роли `admin`.

        Требования к телу (иначе `400` с текстом ошибки):
        - `name`: обязательно, 1–64 символа; пробелы по краям обрезаются;
        - `description`: необязательно, до 255 символов; пустая строка сохраняется как `null`.

        Название уникально **без учёта регистра**: «Бухгалтер» и « бухгалтер » —
        одна и та же персона, повтор вернёт `409`.

        Коды ответов:
        - `201` — персона создана, в теле — созданная персона (`users_count: 0`);
        - `400 invalid request body` — тело не парсится как JSON;
        - `400 name must be 1-64 characters` / `400 description must be at most 255 characters`
        — не прошла валидация;
        - `401 unauthorized` / `403 forbidden` — из middleware Auth/IsAdmin;
        - `409 persona with this name already exists` — такое название уже есть;
        - `500 failed to create persona` — прочая ошибка БД.
      parameters:
      - description: Название и описание
        in: body
        name: persona
        required: true
        schema:
          $ref: '#/definitions/request.CreatePersonaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Созданная персона
          schema:
            $ref: '#/definitions/model.Persona'
        "400":
          description: Невалидное тело запроса или значения полей
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав (требуется роль admin)
          schema:
            type: string
        "409":
          description: Персона с таким названием уже есть
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Создание персоны
      tags:
      - Personas
  /personas/{id}:
    delete:
      description: |-
        Удаляет персону из справочника. Доступно только роли `admin`.

        Пользователи с этой персоной **не удаляются** и не блокируются: у них персона
        становится пустой (`persona: null` в `GET /users` и `GET /auth/me`). Права
        пользователей не меняются — персона на них не влияет. Сколько пользователей
        затронет удаление, видно в `users_count` из `GET /personas`.

        Коды ответов:
        - `204` — персона удалена (тело пустое);
        - `400 invalid persona id` — `id` в пути не UUID;
        - `401 unauthorized` / `403 forbidden` — из middleware Auth/IsAdmin;
        - `404 persona not found` — персоны с таким `id` нет (в т.ч. уже удалена);
        - `500 failed to delete persona` — ошибка БД.
      parameters:
      - description: ID персоны (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "204":
          description: Персона удалена
        "400":
          description: id не UUID
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав (требуется роль admin)
          schema:
            type: string
        "404":
          description: Персона не найдена
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Удаление персоны
      tags:
      - Personas
    patch:
      consumes:
      - application/json
      description: |-
        Частичное (PATCH) обновление персоны: название и/или описание. Пользователи,
        которым назначена персона, сразу видят новое название (`GET /users`,
        `GET /auth/me`) — персона хранится ссылкой, а не копией. Доступно только роли `admin`.

        Тело — только изменяемые поля (оба необязательны, но хотя бы одно обязательно):
        - `name`: если передано — 1–64 символа, пробелы по краям обрезаются;
        - `description`: если передано — до 255 символов; пустая строка `""` удаляет описание
        (станет `null`); если не передано — не меняется.

        Коды ответов:
        - `200` — персона обновлена, в теле — актуальная персона;
        - `400 invalid persona id` — `id` в пути не UUID;
        - `400 invalid request body` — тело не парсится; либо текст ошибки валидации
        (в т.ч. `at least one field must be provided`, если не передано ни одно поле);
        - `401 unauthorized` / `403 forbidden` — из middleware Auth/IsAdmin;
        - `404 persona not found` — персоны с таким `id` нет;
        - `409 persona with this name already exists` — новое название занято
        другой персоной (без учёта регистра);
        - `500 failed to update persona` — прочая ошибка БД.
      parameters:
      - description: ID персоны (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: persona
        required: true
        schema:
          $ref: '#/definitions/request.UpdatePersonaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённая персона
          schema:
            $ref: '#/definitions/model.Persona'
        "400":
          description: id не UUID или невалидное тело запроса
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав (требуется роль admin)
          schema:
            type: string
        "404":
          description: Персона не найдена
          schema:
            type: string
        "409":
          description: Персона с таким названием уже есть
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Изменение персоны
      tags:
      - Personas
  /ping:
    get:
      description: |-
        Лёгкий liveness-пробник: подтверждает, что HTTP-сервер поднят и роутинг
        работает. НЕ проверяет доступность PostgreSQL и внешних сервисов —
        всегда отвечает `200 pong`, если процесс жив. Аутентификация не требуется.
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Проверка доступности API-сервера
      tags:
      - Система
  /recurring-payments:
    get:
      description: Возвращает все шаблоны регулярных платежей команды (включая остановленные).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.RecurrentPayment'
            type: array
        "500":
          description: Не удалось получить регулярные платежи
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить список регулярных платежей
      tags:
      - Recurring Payments
    post:
      consumes:
      - application/json
      description: Создает шаблон регулярного платежа и назначает ответственного (только
        администратор).
      parameters:
      - description: Данные регулярного платежа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateRecurrentPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Идентификатор созданного платежа
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректное тело запроса
          schema:
            type: string
        "500":
          description: Не удалось создать регулярный платеж
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать регулярный платеж
      tags:
      - Recurring Payments
  /recurring-payments/{id}:
    delete:
      description: 'Мягко останавливает шаблон: новые периоды не создаются, напоминания
        прекращаются, история сохраняется.'
      parameters:
      - description: UUID регулярного платежа
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Регулярный платеж остановлен
        "400":
          description: Некорректный UUID
          schema:
            type: string
        "404":
          description: Регулярный платеж не найден
          schema:
            type: string
        "500":
          description: Не удалось остановить регулярный платеж
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Остановить регулярный платеж
      tags:
      - Recurring Payments
    patch:
      consumes:
      - application/json
      description: Частично обновляет сумму, валюту, описание и ответственного. Поля
        графика неизменяемы.
      parameters:
      - description: UUID регулярного платежа
        in: path
        name: id
        required: true
        type: string
      - description: Новые параметры регулярного платежа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateRecurrentPaymentRequest'
      responses:
        "204":
          description: Регулярный платеж обновлен
        "400":
          description: Некорректный UUID или тело запроса
          schema:
            type: string
        "404":
          description: Регулярный платеж не найден
          schema:
            type: string
        "500":
          description: Не удалось обновить регулярный платеж
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Обновить регулярный платеж
      tags:
      - Recurring Payments
  /telegram/miniapp/auth:
    post:
      consumes:
      - application/json
      description: |-
        Проверяет подпись initData Telegram Mini App и, если этот Telegram уже
        привязан к аккаунту, выпускает access-токен (только access, без refresh и cookie).
        Роль берётся из БД, поэтому админ получает полные права и в Mini App.
        Коды ответов: `200` — вошли; `401 invalid_init_data` / `init_data_expired` —
        подпись неверна или данные старше 10 минут; `409 telegram_not_linked` — этот
        Telegram ещё не привязан (нужно вызвать `/telegram/miniapp/link`).
        Сырые initData не логируются. Лимит `30/min` по IP.
      parameters:
      - description: initData из Telegram.WebApp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.MiniAppAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access-токен и профиль
          schema:
            $ref: '#/definitions/response.MiniAppAuthResponse'
        "400":
          description: Невалидное тело запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Неверная или устаревшая initData
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Telegram не привязан
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Бот выключен
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход в Mini App по привязке
      tags:
      - Telegram
  /telegram/miniapp/link:
    post:
      consumes:
      - application/json
      description: |-
        Проверяет подпись initData, затем логин и пароль аккаунта. При успехе
        привязывает текущий Telegram к аккаунту и выпускает access-токен (пароль
        вводится один раз). Коды ответов: `200` — привязано и вошли;
        `401 invalid_init_data` / `init_data_expired` — проблема с initData;
        `401 invalid_credentials` — неверный логин или пароль (не различаются);
        `409 telegram_already_linked` — этот Telegram уже за другим аккаунтом.
        Сырые initData и пароль не логируются. Лимит `10/min` по IP, как у `/auth/login`.
      parameters:
      - description: initData, логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.MiniAppLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access-токен и профиль
          schema:
            $ref: '#/definitions/response.MiniAppAuthResponse'
        "400":
          description: Невалидное тело запроса
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Неверная initData или учётные данные
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Telegram уже привязан к другому аккаунту
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Бот выключен
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Привязка и вход в Mini App по логину/паролю
      tags:
      - Telegram
  /telegram/team-chat:
    get:
      description: Возвращает активный командный чат, куда уходят напоминания. Доступно
        роли `admin`.
      produces:
      - application/json
      responses:
        "200":
          description: Состояние командного чата
          schema:
            $ref: '#/definitions/response.TelegramTeamChatResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Командный чат (админ)
      tags:
      - Telegram
  /telegram/team-chat/test:
    post:
      description: Отправляет тестовое сообщение в командный чат. Доступно роли `admin`.
      produces:
      - application/json
      responses:
        "202":
          description: Сообщение отправлено
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Командный чат не привязан
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "502":
          description: Ошибка Telegram
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Тест командного чата (админ)
      tags:
      - Telegram
  /telegram/webhook:
    post:
      consumes:
      - application/json
      description: |-
        Приём апдейтов Telegram. Проверяется заголовок X-Telegram-Bot-Api-Secret-Token,
        тело разбирается как Update. Ответ всегда 200 (кроме неверного секрета — 401).
      produces:
      - text/plain
      responses:
        "200":
          description: OK
        "401":
          description: Неверный секрет
      summary: Webhook Telegram
      tags:
      - Telegram
  /users:
    get:
      description: |-
        Возвращает всех пользователей (обычных пользователей и администраторов) без пагинации.
        Доступно только роли `admin`. Поле `password_hash` в ответ не попадает
        (скрыто на уровне сериализации).
        У каждого пользователя есть поле `persona` — назначенная персона `{id, name}`
        или `null`, если персона не назначена или была удалена.

        Коды ответов:
        - `200` — объект с массивом пользователей в `items` и общим количеством в `total`;
        - `401 unauthorized` — нет/просрочен access-токен;
        - `403 forbidden` — роль не `admin`;
        - `500 failed to get users` — ошибка БД.
      produces:
      - application/json
      responses:
        "200":
          description: Список пользователей с total
          schema:
            $ref: '#/definitions/response.UserListResponse'
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав (требуется роль admin)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Список пользователей
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: |-
        Создаёт нового пользователя с ролью `user`. Роль не передаётся: администратор
        задаётся только в .env и через API не создаётся. Пароль хэшируется на сервере
        (bcrypt), `login` должен быть уникальным. Доступно только роли `admin`.

        Требования к телу (иначе `400` с текстом ошибки):
        - `full_name`: 3–64 символа;
        - `login`: 3–32 символа, только `[a-zA-Z0-9_.-]`;
        - `password`: 8–72 байта (верхняя граница — ограничение bcrypt);
        - `persona_id`: необязательно, UUID персоны из `GET /personas`.

        Коды ответов:
        - `201` — пользователь создан (тело пустое);
        - `400 invalid request body` — тело не парсится; либо текст ошибки валидации;
        - `400 persona not found` — персоны с таким `persona_id` нет;
        - `401 unauthorized` — нет/просрочен access-токен (middleware Auth);
        - `403 forbidden` — роль не `admin` (middleware IsAdmin);
        - `409 user with this login already exists` — нарушение уникальности login;
        - `500 failed to create user` — прочая ошибка БД.
      parameters:
      - description: Данные создаваемого пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.CreateUserRequest'
      produces:
      - text/plain
      responses:
        "201":
          description: Пользователь создан
        "400":
          description: Невалидное тело запроса, значения полей или несуществующая
            персона
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав (требуется роль admin)
          schema:
            type: string
        "409":
          description: Пользователь с таким login уже существует
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Создание обычного пользователя
      tags:
      - Admin
  /users/{id}:
    delete:
      description: |-
        Удаляет обычного пользователя по идентификатору (path-параметр `id`).
        Доступно только роли `admin`.

        Защитные проверки и коды ответов:
        - `id` не UUID → `400 invalid user id`;
        - пользователь с таким `id` не найден → `404 user not found`;
        - удаляемый — администратор (в т.ч. собственная учётка) →
        `403 admin account is managed via .env`;
        - на пользователя ссылаются другие записи → `409`;
        - `401 unauthorized` / `403 forbidden` — из middleware Auth/IsAdmin;
        - прочая ошибка БД → `500 failed to delete user`;
        - `200` — пользователь удалён.
      parameters:
      - description: ID пользователя (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Пользователь удалён
        "400":
          description: id не является UUID
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав или попытка удалить администратора
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
        "409":
          description: На пользователя ссылаются другие записи
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Удаление пользователя
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: |-
        Частичное (PATCH) обновление данных обычного пользователя: ФИО и/или логин.
        Роль и пароль этим методом не меняются. Учётку администратора менять нельзя —
        она задаётся в .env. Доступно только роли `admin`.

        Тело — только изменяемые поля (оба опциональны, но хотя бы одно обязательно):
        - `full_name`: если передан — 3–64 символа;
        - `login`: если передан — 3–32 символа, только `[a-zA-Z0-9_.-]`.

        Коды ответов:
        - `200` — пользователь обновлён;
        - `400 invalid user id` — `id` не UUID;
        - `400 invalid request body` — тело не парсится; либо текст ошибки валидации
        (в т.ч. `at least one field must be provided`, если оба поля пусты);
        - `401 unauthorized` / `403 forbidden` — из middleware Auth/IsAdmin;
        - `403 admin account is managed via .env` — попытка изменить администратора;
        - `404 user not found` — пользователя с таким `id` нет;
        - `409 user with this login already exists` — логин занят;
        - `500 failed to update user` — ошибка БД.
      parameters:
      - description: ID пользователя (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Обновляемые поля
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.UserUpdateRequest'
      produces:
      - text/plain
      responses:
        "200":
          description: Пользователь обновлён
        "400":
          description: id не UUID или невалидное тело запроса
          schema:
            type: string
        "401":
          description: Не авторизован
          schema:
            type: string
        "403":
          description: Недостаточно прав или попытка изменить администратора
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
        "409":
          description: Логин уже занят
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - CookieAuth: []
      - BearerAuth: []
      summary: Обновление пользователя
      tags:
      - Admin
securityDefinitions:
  BearerAuth:
    description: '"Bearer <access token>"'
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    in: cookie
    name: AccessToken
    type: apiKey
swagger: "2.0"
tags:
- description: Служебные эндпоинты (проверка доступности).
  name: Система
- description: Вход, выход, обновление токенов и текущий пользователь.
  name: Auth
- description: Управление пользователями — только администратор. Учётка администратора
    задаётся в .env и через API не меняется.
  name: Admin
- description: Справочник персон — должностей или зон ответственности (Бухгалтер,
    Руководитель, DevOps). Ведёт администратор; при создании пользователя персона
    выбирается из этого списка (`persona_id` в `POST /users`). На права доступа не
    влияет — права задаёт роль.
  name: Personas
